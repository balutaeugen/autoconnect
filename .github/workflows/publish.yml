name: Publish

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type used by Modrinth and CurseForge"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - beta
          - alpha
      publish_modrinth:
        description: "Publish to Modrinth"
        required: true
        default: true
        type: boolean
      publish_curseforge:
        description: "Publish to CurseForge"
        required: true
        default: true
        type: boolean
      publish_github_release:
        description: "Create/update a GitHub release with the built jars"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  prepare_release:
    name: Prepare release branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_branch: ${{ steps.version.outputs.release_branch }}

    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Read Gradle version
        id: gradle-version
        shell: bash
        run: |
          version="$(sed -n 's/^distributionUrl=.*gradle-\([^-]*\)-bin\.zip$/\1/p' gradle/wrapper/gradle-wrapper.properties)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle-version.outputs.version }}

      - name: Resolve release version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timezone
          from pathlib import Path
          import re
          import subprocess

          path = Path("gradle.properties")
          text = path.read_text(encoding="utf-8")
          match = re.search(r"^mod_version=(\d+)\.(\d+)\.(\d+)$", text, re.MULTILINE)
          if not match:
              raise SystemExit("gradle.properties must contain mod_version=YEAR.MONTH.CURRENT_BUILD")

          now = datetime.now(timezone.utc)
          year = int(str(now.year)[-2:])
          month = now.month
          current_year, current_month, current_build = map(int, match.groups())
          current_version = f"{current_year}.{current_month}.{current_build}"

          def tag_exists(tag):
              return subprocess.run(
                  ["git", "show-ref", "--verify", "--quiet", f"refs/tags/{tag}"],
                  check=False,
              ).returncode == 0

          published_tag = f"published/{current_version}"
          has_publish_markers = bool(
              subprocess.check_output(
                  ["git", "tag", "--list", "published/*"], text=True
              ).strip()
          )
          if not has_publish_markers and tag_exists(current_version):
              # Bootstrap releases created before publish completion markers existed.
              subprocess.run(["git", "tag", published_tag, current_version], check=True)
              subprocess.run(["git", "push", "origin", published_tag], check=True)

          already_published = tag_exists(published_tag)
          if already_published:
              next_build = current_build + 1 if (current_year, current_month) == (year, month) else 1
              version = f"{year}.{month}.{next_build}"
          else:
              version = current_version
          release_branch = f"release/{version}"

          if already_published:
              updated = re.sub(
                  r"^mod_version=.*$",
                  f"mod_version={version}",
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              path.write_text(updated, encoding="utf-8")

          print(f"version={version}")
          print(f"release_branch={release_branch}")
          print(f"retry={'false' if already_published else 'true'}")
          PY

      - name: Update generated README content
        run: gradle updateReadmeGeneratedContent --no-daemon --console=plain

      - name: Update release branch
        shell: bash
        run: |
          if [[ "${{ steps.version.outputs.retry }}" == "false" ]]; then
            git add gradle.properties README.md
            git commit -m "Bump version to ${{ steps.version.outputs.version }}"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
          git push origin HEAD:refs/heads/${{ steps.version.outputs.release_branch }}

  changelog:
    name: Generate changelog for ${{ needs.prepare_release.outputs.version }}
    needs: prepare_release
    runs-on: ubuntu-latest

    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare_release.outputs.release_branch }}
          fetch-depth: 0

      - name: Generate changelog
        env:
          VERSION: ${{ needs.prepare_release.outputs.version }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          version = os.environ["VERSION"]
          version_tag = re.compile(r"^\d+\.\d+\.\d+$")
          tags = subprocess.check_output(
              ["git", "tag", "--merged", "HEAD", "--sort=-version:refname"],
              text=True,
          ).splitlines()
          previous_version = next(
              (tag for tag in tags if version_tag.fullmatch(tag) and tag != version),
              None,
          )
          if previous_version is None:
              raise SystemExit("No previous version tag was found for changelog generation")

          log = subprocess.check_output(
              ["git", "log", f"{previous_version}..HEAD", "--reverse", "--pretty=format:%h%x09%s"],
              text=True,
          ).splitlines()
          entries = [
              f"- {subject} (`{commit}`)"
              for line in log
              if line.strip()
              for commit, subject in [line.split("\t", 1)]
          ]
          if not entries:
              raise SystemExit(f"No changes found after {previous_version}")

          changelog = Path(".changelog") / f"changelog-{version}.md"
          changelog.parent.mkdir(exist_ok=True)
          changelog.write_text(
              f"# AutoConnect {version}\n\n"
              f"Changes since {previous_version}:\n\n"
              + "\n".join(entries)
              + "\n",
              encoding="utf-8",
          )
          print(f"Generated {changelog} from {previous_version}..HEAD")
          PY

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog-${{ needs.prepare_release.outputs.version }}
          path: .changelog/changelog-${{ needs.prepare_release.outputs.version }}.md
          if-no-files-found: error

  publish:
    name: Build and publish ${{ needs.prepare_release.outputs.version }}
    needs:
      - prepare_release
      - changelog
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare_release.outputs.release_branch }}
          fetch-depth: 0

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog-${{ needs.prepare_release.outputs.version }}
          path: .changelog

      - name: Check completed publishers
        id: publish-status
        env:
          VERSION: ${{ needs.prepare_release.outputs.version }}
        shell: bash
        run: |
          for publisher in github modrinth curseforge; do
            if git show-ref --verify --quiet "refs/tags/published/$publisher/$VERSION"; then
              echo "$publisher=true" >> "$GITHUB_OUTPUT"
            else
              echo "$publisher=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Read Gradle version
        id: gradle-version
        shell: bash
        run: |
          version="$(sed -n 's/^distributionUrl=.*gradle-\([^-]*\)-bin\.zip$/\1/p' gradle/wrapper/gradle-wrapper.properties)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle-version.outputs.version }}

      - name: Prepare changelog
        env:
          VERSION: ${{ needs.prepare_release.outputs.version }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          version = os.environ["VERSION"]
          changelog = Path(".changelog") / f"changelog-{version}.md"
          if not changelog.is_file():
              raise SystemExit(f"Missing changelog file for {version}: {changelog}")

          Path("build").mkdir(exist_ok=True)
          Path("build/publish-changelog.md").write_text(changelog.read_text(encoding="utf-8"), encoding="utf-8")
          PY

      - name: Build publish artifacts
        run: bash .github/scripts/gradle-with-modmenu-fallback.sh preparePublishArtifacts

      - name: Validate publish artifacts
        env:
          VERSION: ${{ needs.prepare_release.outputs.version }}
        run: python .github/actions/publish/validate_publish_artifacts.py

      - name: Publish GitHub release
        if: ${{ inputs.publish_github_release && steps.publish-status.outputs.github != 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ needs.prepare_release.outputs.version }}
          github-commitish: ${{ needs.prepare_release.outputs.release_branch }}
          github-draft: false
          github-prerelease: ${{ inputs.release_type != 'release' }}
          files: |
            publish/*.jar
            publish/*.jar.sha256
          name: AutoConnect ${{ needs.prepare_release.outputs.version }}
          version: ${{ needs.prepare_release.outputs.version }}
          version-type: ${{ inputs.release_type }}
          changelog-file: build/publish-changelog.md
          retry-attempts: 3

      - name: Record GitHub publish
        if: ${{ inputs.publish_github_release && steps.publish-status.outputs.github != 'true' }}
        env:
          VERSION: ${{ needs.prepare_release.outputs.version }}
        run: |
          git tag "published/github/$VERSION"
          git push origin "published/github/$VERSION"

      - name: Publish Modrinth artifacts
        if: ${{ inputs.publish_modrinth && steps.publish-status.outputs.modrinth != 'true' }}
        env:
          VERSION: ${{ needs.prepare_release.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python .github/actions/publish/publish_modrinth.py

      - name: Record Modrinth publish
        if: ${{ inputs.publish_modrinth && steps.publish-status.outputs.modrinth != 'true' }}
        env:
          VERSION: ${{ needs.prepare_release.outputs.version }}
        run: |
          git tag "published/modrinth/$VERSION"
          git push origin "published/modrinth/$VERSION"

      - name: Publish CurseForge artifacts
        if: ${{ inputs.publish_curseforge && steps.publish-status.outputs.curseforge != 'true' }}
        env:
          VERSION: ${{ needs.prepare_release.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: python .github/actions/publish/publish_curseforge.py

      - name: Record CurseForge publish
        if: ${{ inputs.publish_curseforge && steps.publish-status.outputs.curseforge != 'true' }}
        env:
          VERSION: ${{ needs.prepare_release.outputs.version }}
        run: |
          git tag "published/curseforge/$VERSION"
          git push origin "published/curseforge/$VERSION"

      - name: Mark release as published
        env:
          VERSION: ${{ needs.prepare_release.outputs.version }}
        run: |
          git tag "published/$VERSION"
          git push origin "published/$VERSION"

name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Read Gradle version
        id: gradle-version
        shell: bash
        run: |
          version="$(sed -n 's/^distributionUrl=.*gradle-\([^-]*\)-bin\.zip$/\1/p' gradle/wrapper/gradle-wrapper.properties)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle-version.outputs.version }}

      - name: Check
        run: bash .github/scripts/gradle-with-modmenu-fallback.sh checkReadmeGeneratedContent checkAllMinecraftVersions :unit-tests:test

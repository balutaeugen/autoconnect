apply from: rootProject.file("gradle/autoconnect.gradle")

def minecraftVersion = autoconnectMinecraftVersionFromProject("forge", project.name)
def forgeTarget = autoconnectLoaderTarget("forge", minecraftVersion)

version = rootProject.mod_version
group = rootProject.maven_group
base.archivesName = "${rootProject.archives_base_name}-forge"

configureAutoconnectJava(project)

sourceSets {
    main {
        java {
            srcDir rootProject.file("src/common/java")
            srcDir rootProject.file("src/forge/java")
        }
        resources {
            srcDir rootProject.file("src/common/resources")
            srcDir rootProject.file("src/forge/resources")
        }
        output.resourcesDir = layout.buildDirectory.dir("classes/java/main").get().asFile
    }
    test {
        java.setSrcDirs([])
        resources.setSrcDirs([])
    }
}

minecraft {
    mappings channel: "official", version: minecraftVersion

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir("run")
            args "--mixin.config=autoconnect.client.mixins.json"

            mods {
                autoconnect {
                    source sourceSets.main
                }
            }
        }

        register("client")
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraftVersion}-${forgeTarget.forgeVersion}")
}

processResources {
    def resourceProperties = [
            "version"                : project.version,
            "minecraft_version_range": forgeTarget.minecraftRange,
            "forge_version_range"    : forgeTarget.forgeRange
    ]

    inputs.properties(resourceProperties)
    filteringCharset = "UTF-8"

    filesMatching("META-INF/mods.toml") {
        expand resourceProperties
    }
}

tasks.named("compileJava", JavaCompile) {
    source = rootProject.fileTree("src/common/java") + rootProject.fileTree("src/forge/java")
}

tasks.named("jar", Jar) {
    archiveVersion.set("${project.version}-${minecraftVersion}")

    manifest {
        attributes["MixinConfigs"] = "autoconnect.client.mixins.json"
    }

    from(rootProject.file("LICENSE")) {
        rename { "${it}_${rootProject.archives_base_name}" }
    }
}

apply from: rootProject.file("gradle/autoconnect.gradle")

def minecraftVersion = autoconnectMinecraftVersionFromProject("neoforge", project.name)
def neoForgeTarget = autoconnectLoaderTarget("neoforge", minecraftVersion)

version = rootProject.mod_version
group = rootProject.maven_group
base.archivesName = "${rootProject.archives_base_name}-neoforge"

configureAutoconnectJava(project)

sourceSets {
    main {
        java {
            srcDir rootProject.file("src/common/java")
            srcDir rootProject.file("src/neoforge/java")
        }
        resources {
            srcDir rootProject.file("src/common/resources")
            srcDir rootProject.file("src/neoforge/resources")
        }
    }
    test {
        java.setSrcDirs([])
        resources.setSrcDirs([])
    }
}

neoForge {
    version = neoForgeTarget.neoForgeVersion

    runs {
        client {
            client()
            gameDirectory = project.file("run")
        }
    }

    mods {
        autoconnect {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    def resourceProperties = [
            "version"                : project.version,
            "minecraft_version_range": neoForgeTarget.minecraftRange,
            "neoforge_version_range" : neoForgeTarget.neoForgeRange
    ]

    inputs.properties(resourceProperties)
    filteringCharset = "UTF-8"

    filesMatching("META-INF/neoforge.mods.toml") {
        expand resourceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    source = rootProject.fileTree("src/common/java") + rootProject.fileTree("src/neoforge/java")
}

tasks.named("jar", Jar) {
    archiveVersion.set("${project.version}-${minecraftVersion}")

    manifest {
        attributes["MixinConfigs"] = "autoconnect.client.mixins.json"
    }

    from(rootProject.file("LICENSE")) {
        rename { "${it}_${rootProject.archives_base_name}" }
    }
}
